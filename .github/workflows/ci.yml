name: CI

# Nur manuell, solange das GitHub-Konto für Actions gesperrt ist (Abrechnung); sonst kommen bei jedem Push Fehler-Mails.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Build (Vorschau, Platzhalter erlaubt)
        env:
          ALLOW_PLACEHOLDERS: "true"
        run: npm run build
